name: API startup and contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-contracts:
    name: API contracts (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-api-test.txt
      - name: Install locked API dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-api-test.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Test actual API contracts with controlled predictor
        working-directory: backend
        run: python -m pytest tests -q
      - name: Smoke test actual Uvicorn without ML packages or artifacts
        working-directory: backend
        run: python tests/smoke_api.py
